[build-system]
requires = ["setuptools>=68,<81", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "smash-hcm-databank-client"
version = "0.13.0"
description = "Download and verify published SMASH-HCM databank datasets"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/SMASH-HCM/smash-hcm-databank-client"
Repository = "https://github.com/SMASH-HCM/smash-hcm-databank-client"
Issues = "https://github.com/SMASH-HCM/smash-hcm-databank-client/issues"

[project.optional-dependencies]
secure = ["keyring>=25,<26"]
ui = ["questionary>=2,<3"]
binary = ["questionary>=2,<3", "keyring>=25,<26", "pyinstaller>=6,<7"]
dev = ["pytest>=7.4,<9", "build>=1.2,<2"]

[project.scripts]
smash-hcm-databank-client = "smash_hcm_databank_client.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["smash_hcm_databank_client*"]

[tool.setuptools.package-data]
smash_hcm_databank_client = ["resources/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: optional tests requiring an external service",
  "future: executable contracts for a planned feature (strict expected failure until implemented)",
]
