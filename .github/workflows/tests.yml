name: Package and contracts
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
        include:
          - os: macos-15
            python: '3.12'
          - os: macos-15-intel
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,ui]"
      - run: python -m pytest -m "not integration"
      - run: python -m build
      - name: Smoke test installed wheel outside the checkout
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile, venv
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          with tempfile.TemporaryDirectory() as root:
              root = pathlib.Path(root)
              env = root / 'venv'
              venv.create(env, with_pip=True)
              python = env / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python')
              subprocess.run([str(python), '-m', 'pip', 'install', '--no-deps', str(wheel)], check=True)
              subprocess.run([str(python), '-m', 'omop_exporter', '--help'], cwd=root, check=True)
              subprocess.run([str(python), '-m', 'main', '--help'], cwd=root, check=True)
              subprocess.run([str(python), '-c', 'import main; assert len(main.COPY_RE.findall(main.SQL_PATH.read_text())) == 7'], cwd=root, check=True)
