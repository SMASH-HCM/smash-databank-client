dump: ./private/releases/latest.dump
output_dir: ./private/exports/current
hash_dump: false
database:
  host: localhost
  docker_host: host.docker.internal
  port: 5432
  dbname: smash_cardiac
  user: postgres
  password_env: PGPASSWORD
sidecars:
  florence_clinical: ./private/curated/FLORENCE/Clinical
  rennes_clinical: ./private/raw/RENNES/Clinical/rennes_hcm_clinical.csv
  rennes_endpoints: ./private/raw/RENNES/Clinical/renne_hcm_endpoints.csv
tabular:
  filename: omop_tabular.csv
  landmarks: true
  sites: [FLORENCE, RENNES]
  endpoints: [overall]
  domains: [condition, measurement, observation, procedure, drug]
  lookback_years: 5
assets:
  image_occurrences: null
  data_root: ./private/raw
